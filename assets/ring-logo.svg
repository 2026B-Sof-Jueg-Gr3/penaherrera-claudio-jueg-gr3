      <stop offset="0%" stop-color="#16345a"/>
      <stop offset="70%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#050b14"/>
    </radialGradient>
    <linearGradient id="oro" x1="0%" y1="0%" x2="100%" y2="100%">
